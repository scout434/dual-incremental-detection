# DuET 论文 Diverse Weather Two Phase 指标配置。
#
# 场景：
#   Daytime Sunny [1:4] -> Night Sunny [5:7]
#
# 使用前需要先完成：
#   1. 主训练：train_weather_2phase_full.yaml
#   2. 两个 GI 参考模型训练：
#      train_reference_daytime_sunny_5_7.yaml
#      train_reference_night_sunny_1_4.yaml

manifest: outputs/status3_weather_2phase_duet_yolo11n/eval_manifest.json
output: outputs/status3_weather_2phase_duet_yolo11n/paper_metrics_results.json
device: 0
metric: map50
split: val
clamp_to_one: false

checkpoint_aliases:
  ref_daytime_sunny_5_7: outputs/status3_reference_daytime_sunny_5_7_yolo11n/task_1_reference_daytime_sunny_5_7_best.pt
  ref_night_sunny_1_4: outputs/status3_reference_night_sunny_1_4_yolo11n/task_1_reference_night_sunny_1_4_best.pt

retention:
  # RI：T2 模型在旧任务 Daytime Sunny [1:4] 上的 mAP / T1 首次学完 Daytime Sunny [1:4] 的 mAP
  - name: RI_DaytimeSunny_1_4_after_T2
    numerator:
      checkpoint: final
      data: /root/autodl-tmp/test_tasks/status3/daytime_sunny_1_4/data.yaml
      global_class_indices: [0, 1, 2, 3]
    denominator:
      checkpoint: t1
      data: /root/autodl-tmp/test_tasks/status3/daytime_sunny_1_4/data.yaml
      global_class_indices: [0, 1, 2, 3]

generalization:
  # GI：T2 模型在未见 Daytime Sunny [5:7] 上的 mAP / 单独训练 Daytime Sunny [5:7] 参考模型的 mAP
  - name: GI_DaytimeSunny_5_7_at_T2
    numerator:
      checkpoint: final
      data: /root/autodl-tmp/test_tasks/status3/daytime_sunny_5_7/data.yaml
      global_class_indices: [4, 5, 6]
    denominator:
      checkpoint: ref_daytime_sunny_5_7
      data: /root/autodl-tmp/test_tasks/status3/daytime_sunny_5_7/data.yaml
      global_class_indices: [4, 5, 6]

  # GI：T2 模型在未见 Night Sunny [1:4] 上的 mAP / 单独训练 Night Sunny [1:4] 参考模型的 mAP
  - name: GI_NightSunny_1_4_at_T2
    numerator:
      checkpoint: final
      data: /root/autodl-tmp/test_tasks/status3/night_sunny_1_4/data.yaml
      global_class_indices: [0, 1, 2, 3]
    denominator:
      checkpoint: ref_night_sunny_1_4
      data: /root/autodl-tmp/test_tasks/status3/night_sunny_1_4/data.yaml
      global_class_indices: [0, 1, 2, 3]
