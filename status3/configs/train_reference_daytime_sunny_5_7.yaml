experiment:
  # GI 分母参考模型：只训练 Daytime Sunny [5:7]。
  name: status3_reference_daytime_sunny_5_7_yolo11n
  output_dir: outputs/status3_reference_daytime_sunny_5_7_yolo11n
  seed: 42

detector:
  base_weights: yolo11n.pt
  model_yaml: yolo11n.yaml
  total_classes: 7
  names:
    0: class_1
    1: class_2
    2: class_3
    3: class_4
    4: class_5
    5: class_6
    6: class_7

training:
  epochs: 1
  warmup_epochs: 5
  imgsz: 640
  batch: 64
  workers: 0
  device: 0
  optimizer: AdamW
  cos_lr: true
  lr0: 0.01
  lrf: 0.01
  freeze: 0
  weight_decay_first: 0.0005
  weight_decay_incremental: 0.001

duet:
  # 参考模型是 GI 分母，只做单任务训练，不做 DuET 增量融合。
  enabled: false
  use_duet_module: false
  gamma: 0.1
  alpha_base: 0.5
  distill_weight: 0.0
  dc_weight: 0.0
  distill_temperature: 2.0
  shared_key_exclude:
    - model.23.dfl
    - model.23.cv2
    - model.23.cv3
  verbose_merge: false

tasks:
  # TODO：把 data 改成你服务器上 Daytime Sunny 5-7 切片的真实 data.yaml。
  - name: reference_daytime_sunny_5_7
    data: /root/autodl-tmp/test_tasks/status3/daytime_sunny_5_7/data.yaml
    class_indices: [4, 5, 6]
    labels_are_global: false
