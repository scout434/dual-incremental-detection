manifest: status3/output/main/eval_manifest.json
output: status3/output/main/metrics.json
device: 0
metric: map50
split: val
clamp_to_one: false

checkpoint_aliases:
  final: status3/output/t2_only/task_2_night_sunny_5_7_duet.pt
  latest: status3/output/t2_only/task_2_night_sunny_5_7_duet.pt
  t1: status3/output/main/task_1_daytime_sunny_1_4_best.pt
  task_1: status3/output/main/task_1_daytime_sunny_1_4_best.pt
  daytime_sunny_1_4: status3/output/main/task_1_daytime_sunny_1_4_best.pt
  ref_daytime_sunny_5_7: status3/output/ref_daytime/task_1_daytime_sunny_5_7_best.pt
  ref_night_sunny_1_4: status3/output/ref_night/task_1_night_sunny_1_4_best.pt

retention:
  - name: RI_DaytimeSunny_1_4_after_T2
    numerator:
      checkpoint: final
      data: data/status3/daytime_sunny_1_4/data.yaml
      global_class_indices: [0, 1, 2, 3]
    denominator:
      checkpoint: t1
      data: data/status3/daytime_sunny_1_4/data.yaml
      prepare_global_labels: false

generalization:
  - name: GI_DaytimeSunny_5_7_at_T2
    numerator:
      checkpoint: final
      data: data/status3/daytime_sunny_5_7/data.yaml
      global_class_indices: [4, 5, 6]
    denominator:
      checkpoint: ref_daytime_sunny_5_7
      data: data/status3/daytime_sunny_5_7/data.yaml
      prepare_global_labels: false

  - name: GI_NightSunny_1_4_at_T2
    numerator:
      checkpoint: final
      data: data/status3/night_sunny_1_4/data.yaml
      global_class_indices: [0, 1, 2, 3]
    denominator:
      checkpoint: ref_night_sunny_1_4
      data: data/status3/night_sunny_1_4/data.yaml
      prepare_global_labels: false
