experiment:
  name: status3_weather_2phase_duet_yolo11n
  output_dir: status3/output/t2_only
  seed: 42
resume:
  start_task: 2
  previous_checkpoint: status3/output/main/task_1_daytime_sunny_1_4_best.pt
detector:
  base_weights: yolo11n.pt
  model_yaml: yolo11n.yaml
  total_classes: 7
  names:
    0: bike
    1: bus
    2: car
    3: motor
    4: person
    5: rider
    6: truck
training:
  epochs: 1
  warmup_epochs: 5
  imgsz: 640
  batch: 64
  workers: 0
  device: 0
  optimizer: AdamW
  cos_lr: true
  lr0: 0.01
  lrf: 0.01
  freeze: 0
  weight_decay_first: 0.0005
  weight_decay_incremental: 0.001
duet:
  enabled: true
  use_duet_module: true
  gamma: 0.1
  alpha_base: 0.5
  distill_weight: 0.01
  dc_weight: 0.01
  distill_temperature: 2.0
  shared_key_exclude:
  - model.23
  verbose_merge: false
tasks:
- name: daytime_sunny_1_4
  data: data/status3/daytime_sunny_1_4/data.yaml
  class_indices:
  - 0
  - 1
  - 2
  - 3
  labels_are_global: false
- name: night_sunny_5_7
  data: data/status3/night_sunny_5_7/data.yaml
  class_indices:
  - 4
  - 5
  - 6
  labels_are_global: false
