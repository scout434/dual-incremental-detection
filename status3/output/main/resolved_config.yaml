experiment:
  name: status3_weather_2phase_duet_yolo11n
  output_dir: status3/output/main
  seed: 42
detector:
  base_weights: yolo11n.pt
  model_yaml: yolo11n.yaml
  total_classes: 7
  names:
    0: class_1
    1: class_2
    2: class_3
    3: class_4
    4: class_5
    5: class_6
    6: class_7
training:
  epochs: 100
  warmup_epochs: 5
  imgsz: 640
  batch: 64
  workers: 0
  device: 1
  optimizer: AdamW
  cos_lr: true
  lr0: 0.01
  lrf: 0.01
  freeze: 0
  weight_decay_first: 0.0005
  weight_decay_incremental: 0.001
duet:
  enabled: true
  use_duet_module: true
  gamma: 0.1
  alpha_base: 0.5
  distill_weight: 0.01
  dc_weight: 0.01
  distill_temperature: 2.0
  shared_key_exclude:
  - model.23
  verbose_merge: false
tasks:
