experiment:
  name: diverse_weather_duet_yolo11n
  output_dir: outputs/diverse_weather_duet_yolo11n
  seed: 42

detector:
  base_weights: yolo11n.pt
  total_classes: 20

training:
  epochs: 50
  imgsz: 640
  batch: 16
  workers: 4
  device: 0
  optimizer: auto
  lr0: 0.01

duet:
  enabled: true
  alpha_old: 1.0
  alpha_new: 1.0
  shared_key_exclude:
    - detect
    - dfl
    - cv2
    - cv3

tasks:
  - name: sunny_base
    data: E:/datasets/duet_weather_tasks/task_1/data.yaml
  - name: rainy_inc
    data: E:/datasets/duet_weather_tasks/task_2/data.yaml
  - name: foggy_inc
    data: E:/datasets/duet_weather_tasks/task_3/data.yaml

