# ============================================================
# DuET 双增量目标检测 - 烟雾玩具实验配置
# 实验类型：最小化快速验证
#
# 使用方法：
#   python tools/train.py --config configs/smoke_toy_yolo.yaml
# ============================================================

experiment:
  name: human_duet_yolo11n
  output_dir: outputs/human_duet_yolo11n
  seed: 42

detector:
  base_weights: yolo11n.pt
  total_classes: 2

training:
  epochs: 10
  imgsz: 128
  batch: 16
  workers: 0
  device: 0
  optimizer: auto
  lr0: 0.0005

duet:
  # ===========================================
  # DuET 核心配置
  # ===========================================
  enabled: true

  # DuET Module 逐层动态融合
  use_duet_module: true

  # 逐层系数参数
  gamma: 0.5
  alpha_base: 0.5

  # 固定系数（不使用 DuET Module 时）
  alpha_old: 1.0
  alpha_new: 1.0

  # 训练损失权重
  distill_weight: 0.5
  dc_weight: 0.1
  distill_temperature: 2.0

  # 共享参数排除
  shared_key_exclude:
  - 23.dfl
  - 23.cv2
  - 23.cv3

  verbose_merge: false

tasks:
  - name: stand_run
    data: F:/Datasets/human_activity_duet_tasks/task_1/data.yaml

  - name: sit_squat
    data: F:/Datasets/human_activity_duet_tasks/task_2/data.yaml

  - name: fall
    data: F:/Datasets/human_activity_duet_tasks/task_3/data.yaml
