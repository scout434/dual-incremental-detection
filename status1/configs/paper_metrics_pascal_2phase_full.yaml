# status1：论文 Pascal 两阶段实验指标配置。
#
# 对应论文表格：
#   T1: VOC [1:10]
#   T2: Clipart [11:20]
#
# 需要先完成：
#   1. 数据切片 prepare_pascal_2phase_slices.yaml
#   2. 主训练 train_pascal_2phase_full.yaml
#   3. 两个 GI 分母参考模型：
#      train_reference_voc_11_20.yaml
#      train_reference_clipart_1_10.yaml

manifest: outputs/status1_pascal_2phase_duet_yolo11n/eval_manifest.json
output: outputs/status1_pascal_2phase_duet_yolo11n/paper_metrics_results.json
device: 0
metric: map50
split: val
clamp_to_one: false

checkpoint_aliases:
  ref_voc_11_20: outputs/status1_reference_voc_11_20_yolo11n/task_1_reference_voc_11_20_best.pt
  ref_clipart_1_10: outputs/status1_reference_clipart_1_10_yolo11n/task_1_reference_clipart_1_10_best.pt

retention:
  # RI：T2 完成后，最终模型在旧任务 VOC [1:10] 上的 mAP / T1 刚学完 VOC [1:10] 的 mAP。
  - name: RI_VOC_1_10_after_T2
    numerator:
      checkpoint: final
      data: data/pascal_voc_yolo/voc_1_10/data.yaml
    denominator:
      checkpoint: t1
      data: data/pascal_voc_yolo/voc_1_10/data.yaml

generalization:
  # GI：T2 完成后，模型在未见类别 VOC [11:20] 上的 mAP / 单独训练 VOC [11:20] 参考模型的 mAP。
  - name: GI_VOC_11_20_at_T2
    numerator:
      checkpoint: final
      data: data/pascal_voc_yolo/voc_11_20/data.yaml
    denominator:
      checkpoint: ref_voc_11_20
      data: data/pascal_voc_yolo/voc_11_20/data.yaml

  # GI：T2 完成后，模型在未见域/未见类别 Clipart [1:10] 上的 mAP / 单独训练 Clipart [1:10] 参考模型的 mAP。
  - name: GI_Clipart_1_10_at_T2
    numerator:
      checkpoint: final
      data: data/clipart_paper_yolo/clipart_1_10/data.yaml
    denominator:
      checkpoint: ref_clipart_1_10
      data: data/clipart_paper_yolo/clipart_1_10/data.yaml
