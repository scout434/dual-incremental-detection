# Paper metrics for the T2-only resumed local-head run.
manifest: outputs/status1_pascal_2phase_local_head_duet_yolo11n_t2_only_test-t2/eval_manifest.json
output: outputs/status1_pascal_2phase_local_head_duet_yolo11n_t2_only_test-t2/paper_metrics_results.json
device: 0
metric: map50
split: val
clamp_to_one: false

checkpoint_aliases:
