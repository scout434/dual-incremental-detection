      checkpoint: final
      data: data/pascal_voc_yolo/voc_1_10/data.yaml
      prepare_global_labels: true
    denominator:
      checkpoint: t1
      data: data/pascal_voc_yolo/voc_1_10/data.yaml
      prepare_global_labels: false

generalization:
