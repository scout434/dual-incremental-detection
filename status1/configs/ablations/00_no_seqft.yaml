experiment:
  name: ablation_00_no_seqft
  output_dir: status1/output/ablations/00_no_seqft
  seed: 42
resume:
  start_task: 2
  previous_checkpoint: status1/output/ablations/00_no_seqft/reference_full_head.pt
  allow_full_head_previous: true
detector:
  base_weights: yolo11n.pt
  model_yaml: yolo11n.yaml
  total_classes: 20
  names:
    0: bicycle
    1: bird
    2: car
    3: cat
    4: dog
    5: person
    6: aeroplane
    7: boat
    8: bottle
    9: bus
    10: chair
    11: cow
    12: diningtable
    13: horse
    14: motorbike
    15: pottedplant
    16: sheep
    17: sofa
    18: train
    19: tvmonitor
training:
  epochs: 100
  warmup_epochs: 5
  imgsz: 640
  batch: 64
  workers: 0
  device: 0
