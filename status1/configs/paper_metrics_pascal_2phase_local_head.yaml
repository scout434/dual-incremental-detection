# Paper metrics for the status1 local-head experiment.
# Run after:
#   1. train_local_head_pascal_2phase.yaml
#   2. train_reference_voc_11_20_local_head.yaml
#   3. train_reference_clipart_1_10_local_head.yaml
manifest: outputs/status1_pascal_2phase_local_head_duet_yolo11n/eval_manifest.json
output: outputs/status1_pascal_2phase_local_head_duet_yolo11n/paper_metrics_results.json
device: 0
metric: map50
split: val
clamp_to_one: false

checkpoint_aliases:
  ref_voc_11_20: outputs/status1_reference_voc_11_20_local_head_yolo11n/task_1_reference_voc_11_20_local_best.pt
  ref_clipart_1_10: outputs/status1_reference_clipart_1_10_local_head_yolo11n/task_1_reference_clipart_1_10_local_best.pt

retention:
  - name: RI_VOC_1_10_after_T2_local_head
    numerator:
      checkpoint: final
      data: outputs/status1_pascal_2phase_local_head_duet_yolo11n/prepared_cumulative_eval_data/voc_1_10_for_final_eval/data.yaml
      prepare_global_labels: false
    denominator:
      checkpoint: t1
      data: data/pascal_voc_yolo/voc_1_10/data.yaml
      prepare_global_labels: false

generalization:
  - name: GI_VOC_11_20_at_T2_local_head
    numerator:
      checkpoint: final
      data: outputs/status1_pascal_2phase_local_head_duet_yolo11n/prepared_cumulative_eval_data/voc_11_20_for_final_eval/data.yaml
      prepare_global_labels: false
    denominator:
      checkpoint: ref_voc_11_20
      data: data/pascal_voc_yolo/voc_11_20/data.yaml
      prepare_global_labels: false

  - name: GI_Clipart_1_10_at_T2_local_head
    numerator:
      checkpoint: final
      data: outputs/status1_pascal_2phase_local_head_duet_yolo11n/prepared_cumulative_eval_data/clipart_1_10_for_final_eval/data.yaml
      prepare_global_labels: false
    denominator:
      checkpoint: ref_clipart_1_10
      data: data/clipart_paper_yolo/clipart_1_10/data.yaml
      prepare_global_labels: false
