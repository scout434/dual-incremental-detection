experiment:
  # GI 分母参考模型：只训练 Watercolor [4:6]。
  name: status2_reference_watercolor_4_6_yolo11n
  output_dir: outputs/status2_reference_watercolor_4_6_yolo11n
  seed: 42

detector:
  base_weights: yolo11n.pt
  model_yaml: yolo11n.yaml
  total_classes: 20
  names:
    0: bicycle
    1: bird
    2: car
    3: cat
    4: dog
    5: person
    6: aeroplane
    7: boat
    8: bottle
    9: bus
    10: chair
    11: cow
    12: diningtable
    13: horse
    14: motorbike
    15: pottedplant
    16: sheep
    17: sofa
    18: train
    19: tvmonitor

training:
  epochs: 100
  warmup_epochs: 5
  imgsz: 640
  batch: 64
  workers: 0
  device: 0
  optimizer: AdamW
  cos_lr: true
  lr0: 0.01
  lrf: 0.01
  freeze: 0
  weight_decay_first: 0.0005
  weight_decay_incremental: 0.001

duet:
  enabled: false
  use_duet_module: false
  gamma: 0.1
  alpha_base: 0.5
  distill_weight: 0.0
  dc_weight: 0.0
  distill_temperature: 2.0
  shared_key_exclude:
    - dfl
    - cv2
    - cv3
  verbose_merge: false

tasks:
  # TODO：把 data 改成你服务器上 Watercolor 4-6 切片的真实 data.yaml。
  - name: reference_watercolor_4_6
    data: /root/autodl-tmp/test_tasks/status2/watercolor_4_6/data.yaml
    class_indices: [3, 4, 5]
    labels_are_global: auto
